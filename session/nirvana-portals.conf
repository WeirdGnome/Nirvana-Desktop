# xdg-desktop-portal in the Nirvana Desktop session (XDG_CURRENT_DESKTOP=Nirvana):
# the file dialogs come from Nirvana Desktop (nirvana-portal), the rest (light/dark settings,
# screenshots, opening links...) for Flatpaks (Brave, Firefox...) from the GTK backend.
# Without this file the portal does not know which backend to use, and Flatpak programs
# may wait for its answer when they start.
[preferred]
default=gtk
org.freedesktop.impl.portal.FileChooser=nirvana;gtk
