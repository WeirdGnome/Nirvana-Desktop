# xdg-desktop-portal in the Nirvana Desktop session (XDG_CURRENT_DESKTOP=Nirvana):
# file choosers, light/dark settings etc. for Flatpaks (Brave, Firefox...) come
# from the GTK backend. Without this file the portal does not know which backend to
# use, and Flatpak programs may wait for its answer when they start.
[preferred]
default=gtk
